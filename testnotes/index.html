    function confirmDialog({ title, message, confirmLabel = 'Delete', onConfirm }) {
      openModal(`
        <h3 id="modal-title" class="text-base font-bold text-gray-900 dark:text-gray-100 mb-1">${esc(title)}</h3>
        <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">${esc(message)}</p>
        <div class="flex justify-end space-x-2">
          <button type="button" data-modal-close class="${BTN_GHOST}">Cancel</button>
          <button type="button" id="modal-confirm" class="${BTN_DANGER}">${esc(confirmLabel)}</button>
        </div>`);
      const btn = $('modal-confirm');
      btn.addEventListener('click', () => { closeModal(); onConfirm(); });
      btn.focus();
    }

    function promptDialog({ title, value = '', placeholder = '', confirmLabel = 'Save', onSubmit }) {
      openModal(`
        <h3 id="modal-title" class="text-base font-bold text-gray-900 dark:text-gray-100 mb-2">${esc(title)}</h3>
        <input type="text" id="modal-input" maxlength="${MAX_FOLDER_NAME}" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off" class="${INPUT_CLS} mb-4">
        <div class="flex justify-end space-x-2">
          <button type="button" data-modal-close class="${BTN_GHOST}">Cancel</button>
          <button type="button" id="modal-confirm" class="${BTN_PRIMARY}">${esc(confirmLabel)}</button>
        </div>`);
      const input = $('modal-input');
      const submit = () => {
        const v = input.value.trim();
        if (!v) { input.focus(); return; }
        closeModal();
        onSubmit(v);
      };
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      $('modal-confirm').addEventListener('click', submit);
      input.focus();
      input.select();
    }

    /* ------------------------------------------------------------------ *
     * Export / import
     * ------------------------------------------------------------------ */
    function downloadFile(filename, text) {
      const blob = new Blob([text], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);   // revoking immediately can cancel the download
    }

    function openExportModal() {
      saveActiveNote();
      openModal(`
        <h3 id="modal-title" class="text-base font-bold text-gray-900 dark:text-gray-100 mb-1">Export backup</h3>
        <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">Download your notes and folders as a JSON file.</p>

        <label class="flex items-center space-x-2 text-xs font-medium text-gray-700 dark:text-gray-300 cursor-pointer mb-4">
          <input type="checkbox" id="chk-encrypt-export" class="rounded border-gray-300 text-brand-500 focus:ring-brand-500">
          <span>Encrypt with a passphrase</span>
        </label>

        <div id="export-password-section" class="hidden space-y-3 mb-4">
          <div>
            <label for="export-passphrase" class="block text-[11px] font-medium text-gray-500 mb-1">Passphrase (12+ chars; 3 of 4 character classes)</label>
            <input type="password" id="export-passphrase" autocomplete="new-password" class="${INPUT_CLS}">
            <div class="mt-2">
              <div class="flex items-center justify-between mb-1 text-[10px] text-gray-500">
                <span>Strength</span>
                <span id="export-passphrase-strength">None</span>
              </div>
              <div class="h-1.5 w-full bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
                <div id="export-passphrase-meter" class="h-full w-0 rounded-full bg-red-500 transition-all duration-200" aria-hidden="true"></div>
              </div>
            </div>
          </div>
          <div>
            <label for="export-passphrase-confirm" class="block text-[11px] font-medium text-gray-500 mb-1">Confirm passphrase</label>
            <input type="password" id="export-passphrase-confirm" autocomplete="new-password" class="${INPUT_CLS}">
          </div>
          <p class="text-[11px] text-gray-500">If you forget this passphrase, the backup can't be recovered.</p>
        </div>

        <div class="flex justify-end space-x-2">
          <button type="button" data-modal-close class="${BTN_GHOST}">Cancel</button>
          <button type="button" id="btn-process-export" class="${BTN_PRIMARY}">Download backup</button>
        </div>`);

      const chk = $('chk-encrypt-export');
      const passphraseInput = $('export-passphrase');
      const meter = $('export-passphrase-meter');
      const strengthText = $('export-passphrase-strength');

      const updatePassphraseStrength = () => {
        const score = scorePassphrase(passphraseInput.value);
        const percent = Math.min((score / 4) * 100, 100);
        let label = 'None';
        let color = 'bg-red-500';
        if (score >= 3) { label = 'Strong'; color = 'bg-emerald-500'; }
        else if (score >= 2) { label = 'Moderate'; color = 'bg-amber-500'; }
        else if (score >= 1) { label = 'Weak'; color = 'bg-orange-500'; }
        meter.style.width = `${percent}%`;
        meter.className = `h-full rounded-full transition-all duration-200 ${color}`;
        strengthText.textContent = label;
      };

      chk.addEventListener('change', () => {
        $('export-password-section').classList.toggle('hidden', !chk.checked);
        if (chk.checked) passphraseInput.focus();
      });
      passphraseInput.addEventListener('input', updatePassphraseStrength);

      const btn = $('btn-process-export');
      btn.addEventListener('click', async () => {
        saveActiveNote();
        const date = new Date().toISOString().slice(0, 10); // UTC date
        const raw = JSON.stringify({
          version: '2.0',
          exportedAt: new Date().toISOString(),
          folders: state.folders,
          notes: state.notes,
        }, null, 2);

        let payload = raw;
        let filename = `notes-backup-${date}.json`;

        if (chk.checked) {
          const pass = $('export-passphrase').value;
          if (!isStrongPassphrase(pass)) {
            return showToast('Use a passphrase with 12+ characters and at least 3 character classes', 'error');
          }
          if (pass !== $('export-passphrase-confirm').value) return showToast('Passphrases do not match', 'error');

          btn.disabled = true;
          btn.textContent = 'Encrypting…';
          try {
            payload = await encryptData(raw, pass);
            filename = `notes-backup-encrypted-${date}.enc.json`;
          } catch (err) {
            btn.disabled = false;
            btn.textContent = 'Download backup';
            return showToast(err.message || 'Encryption failed', 'error');
          }
        }

        downloadFile(filename, payload);
        closeModal();
        showToast('Backup exported', 'success');
      });
    }

    function handleImportFileSelect(e) {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      if (file.size > MAX_IMPORT_BYTES) return showToast('File too large to import (max 10 MB)', 'error');

      const reader = new FileReader();
      reader.onerror = () => showToast('Could not read that file', 'error');
      reader.onload = () => {
        let parsed;
        try {
          parsed = JSON.parse(reader.result);
        } catch (err) {
          return showToast('That is not a valid JSON file', 'error');
        }
        if (parsed && parsed.encrypted === true && typeof parsed.ciphertext === 'string') {
          return promptImportDecrypt(parsed);
        }
        try {
          promptImportMergeOptions(sanitizeData(parsed));
        } catch (err) {
          showToast(err.message, 'error');
        }
      };
      reader.readAsText(file);
    }

    function promptImportDecrypt(payload) {
      openModal(`
        <h3 id="modal-title" class="text-base font-bold text-gray-900 dark:text-gray-100 mb-1">Encrypted backup</h3>
        <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">Enter the passphrase used when this backup was exported.</p>
        <input type="password" id="import-passphrase" placeholder="Passphrase" autocomplete="current-password" class="${INPUT_CLS} mb-4">
        <div class="flex justify-end space-x-2">
          <button type="button" data-modal-close class="${BTN_GHOST}">Cancel</button>
          <button type="button" id="btn-decrypt-import" class="${BTN_PRIMARY}">Decrypt and continue</button>
        </div>`);

      const input = $('import-passphrase');
      const btn = $('btn-decrypt-import');
      input.focus();

      const run = async () => {
        if (!input.value) return showToast('Enter the passphrase', 'error');
        btn.disabled = true;
        btn.textContent = 'Decrypting…';
        let plain;
        try {
          plain = await decryptData(payload, input.value);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Decrypt and continue';
          return showToast(err.message, 'error');
        }
        try {
          // Close the decrypt modal first so the merge options modal can open cleanly
          closeModal();
          promptImportMergeOptions(sanitizeData(JSON.parse(plain)));
        } catch (err) {
          // Modal already closed; just notify
          showToast('The backup contents are invalid', 'error');
        }
      };
      btn.addEventListener('click', run);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); run(); } });
    }

    function promptImportMergeOptions(data) {
      const n = data.notes.length;
      const f = data.folders.length;
      openModal(`
        <h3 id="modal-title" class="text-base font-bold text-gray-900 dark:text-gray-100 mb-1">Import backup</h3>
        <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">This file has <strong>${n} ${n === 1 ? 'note' : 'notes'}</strong> in <strong>${f} ${f === 1 ? 'folder' : 'folders'}</strong>. Export a backup first if you want a safety net.</p>
        <div class="space-y-2 mb-5">
          <button type="button" id="btn-import-merge" class="w-full text-left p-2.5 rounded-lg border border-gray-200 dark:border-gray-700 hover:border-brand-500 transition-colors">
            <div class="font-semibold text-xs text-gray-800 dark:text-gray-200">Merge with existing notes</div>
            <div class="text-[11px] text-gray-500">Adds new notes and keeps the newer copy of any note that exists in both. Safe to run twice.</div>
          </button>
          <button type="button" id="btn-import-replace" class="w-full text-left p-2.5 rounded-lg border border-red-200 dark:border-red-900/50 hover:border-red-500 bg-red-50/50 dark:bg-red-950/20 transition-colors">
            <div class="font-semibold text-xs text-red-600 dark:text-red-400">Replace everything</div>
            <div class="text-[11px] text-gray-500 dark:text-gray-400">Deletes all current notes and folders, then loads this file.</div>
          </button>
        </div>
        <div class="flex justify-end">
          <button type="button" data-modal-close class="${BTN_GHOST}">Cancel</button>
        </div>`);

      $('btn-import-merge').addEventListener('click', () => { if (applyImport('merge', data)) closeModal(); });
      $('btn-import-replace').addEventListener('click', () => { if (applyImport('replace', data)) closeModal(); });
    }

    // Builds the new dataset without mutating current arrays, so a failed save can be rolled back.
    function applyImport(mode, data) {
      saveActiveNote();
      const previous = { folders: state.folders, notes: state.notes };
      let next;
      let added = 0;
      let updated = 0;

      if (mode === 'replace') {
        next = { folders: data.folders, notes: data.notes };
      } else {
        const folderMap = new Map(state.folders.map((f) => [f.id, f]));
        data.folders.forEach((f) => { if (!folderMap.has(f.id)) folderMap.set(f.id, { ...f }); });

        const noteMap = new Map(state.notes.map((n) => [n.id, n]));
        data.notes.forEach((n) => {
          const existing = noteMap.get(n.id);
          if (!existing) { noteMap.set(n.id, { ...n }); added++; }
          else if (n.updatedAt > existing.updatedAt) { noteMap.set(n.id, { ...n }); updated++; }
        });
        next = { folders: [...folderMap.values()], notes: [...noteMap.values()] };
      }

      const clean = sanitizeData(next);
      state.folders = clean.folders;
      state.notes = clean.notes;
      if (!saveData()) {
        state.folders = previous.folders;
        state.notes = previous.notes;
        return false;
      }

      if (mode === 'replace') {
        state.activeFilter = 'all';
        state.activeNoteId = null;
      } else if (!isValidFilter(state.activeFilter)) {
        state.activeFilter = 'all';
      }
      ensureActiveNote();
      renderApp(true);
      showToast(mode === 'replace' ? 'Backup restored' : `Merged: ${added} added, ${updated} updated`, 'success');
      return true;
    }

      $('mobile-overlay').classList.remove('hidden');
    }
    function closeMobileSidebar() {
      $('sidebar').classList.add('-translate-x-full');
      $('mobile-overlay').classList.add('hidden');

    function openMobileEditor() {

    /* ------------------------------------------------------------------ *
     * Events
     * ------------------------------------------------------------------ */
    function bindEvents() {
      // Global dragend cleanup - BUG FIX
      document.addEventListener('dragend', () => {
        document.querySelectorAll('.is-dragging').forEach(el => el.classList.remove('is-dragging'));
        document.querySelectorAll('.is-drop-target').forEach(el => el.classList.remove('is-drop-target'));
        draggedFolderId = null;
      });

      // Notes list (delegated)
      const list = $('notes-list');
      list.addEventListener('click', (e) => {
        const item = e.target.closest('[data-note-id]');
        if (item) selectNote(item.dataset.noteId, e);
      });
      list.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          const item = e.target.closest('[data-note-id]');
          if (item) { e.preventDefault(); selectNote(item.dataset.noteId, e); }
        }
        // Space to toggle selection in bulk mode
        if (e.key === ' ' && state.isBulkMode) {
          const item = e.target.closest('[data-note-id]');
          if (item) { e.preventDefault(); toggleNoteSelection(item.dataset.noteId); }
        }
      });
      
      // Keyboard navigation for notes list
      list.addEventListener('keydown', (e) => {
        if (!state.isBulkMode && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
          const items = Array.from(list.querySelectorAll('[data-note-id]'));
          const currentIndex = items.findIndex(item => item === document.activeElement);
          const nextIndex = e.key === 'ArrowDown' ? currentIndex + 1 : currentIndex - 1;
          if (nextIndex >= 0 && nextIndex < items.length) {
            e.preventDefault();
            items[nextIndex].focus();
            items[nextIndex].scrollIntoView({ block: 'nearest' });
          }
        }
      });

      // Folders (delegated). IDs come from data attributes, never from inline JS.
      $('folders-container').addEventListener('click', (e) => {
        const row = e.target.closest('[data-folder-id]');
        if (!row) return;
        const id = row.dataset.folderId;
        const actionEl = e.target.closest('[data-action]');
        const action = actionEl ? actionEl.dataset.action : 'select';
        if (action === 'select') setFilter(id);
        else if (action === 'toggle') toggleFolderCollapsed(id);
        else if (action === 'add-subfolder') promptCreateSubFolder(id);
        else if (action === 'move') promptMoveFolder(id);
        else if (action === 'rename') promptRenameFolder(id);
        else if (action === 'delete') confirmDeleteFolder(id);
        else setFilter(id);
      });

      const foldersContainer = $('folders-container');
      const rootDrop = $('folders-root-drop');
      foldersContainer.addEventListener('dragstart', (e) => {
        const row = e.target.closest('[data-folder-id]');
        if (!row) return;
        draggedFolderId = row.dataset.folderId;
        row.classList.add('is-dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedFolderId);
      });
      foldersContainer.addEventListener('dragend', (e) => {
        const row = e.target.closest('[data-folder-id]');
        if (row) row.classList.remove('is-dragging');
        foldersContainer.querySelectorAll('.is-drop-target').forEach((el) => el.classList.remove('is-drop-target'));
        rootDrop.classList.remove('is-drop-target');
        draggedFolderId = null;
      });
      foldersContainer.addEventListener('dragover', (e) => {
        const target = e.target.closest('[data-folder-id]');
        if (!draggedFolderId || !target || target.dataset.folderId === draggedFolderId) return;
        if (collectDescendantFolderIds(draggedFolderId).has(target.dataset.folderId)) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        target.classList.add('is-drop-target');
      });
      foldersContainer.addEventListener('dragleave', (e) => {
        const target = e.target.closest('[data-folder-id]');
        if (target && !target.contains(e.relatedTarget)) target.classList.remove('is-drop-target');
      });
      foldersContainer.addEventListener('drop', (e) => {
        const target = e.target.closest('[data-folder-id]');
        if (!draggedFolderId || !target) return;
        e.preventDefault();
        moveFolderToParent(draggedFolderId, target.dataset.folderId);
      });
      rootDrop.addEventListener('dragover', (e) => {
        if (!draggedFolderId || getFolder(draggedFolderId)?.parentId == null) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        rootDrop.classList.add('is-drop-target');
      });
      rootDrop.addEventListener('dragleave', (e) => {
        if (!rootDrop.contains(e.relatedTarget)) rootDrop.classList.remove('is-drop-target');
      });
      rootDrop.addEventListener('drop', (e) => {
        if (!draggedFolderId) return;
        e.preventDefault();
        rootDrop.classList.remove('is-drop-target');
        moveFolderToParent(draggedFolderId, null);
      });

      document.querySelectorAll('.nav-item').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (!state.isBulkMode) {
            setFilter(btn.dataset.filter);
          }
        });
      });

      // Modal: one set of handlers for every dialog
      $('modal-backdrop').addEventListener('click', (e) => {
        if (e.target.id === 'modal-backdrop' || e.target.closest('[data-modal-close]')) closeModal();
      });

      // Global keys
      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
          e.preventDefault();
          saveActiveNote({ explicit: true });
        } else if (e.key === 'Escape') {
          if (state.isBulkMode) {
            e.preventDefault();
            exitBulkMode();
          } else if (isModalOpen()) {
            e.preventDefault();
            closeModal();
          } else {
            closeMobileSidebar();
          }
        } else if (state.isBulkMode && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'a') {
          e.preventDefault();
          const visibleNotes = getFilteredNotes();
          visibleNotes.forEach(note => state.selectedNotes.add(note.id));
          updateBulkToolbar();
          renderNoteList();
        } else if (state.isBulkMode && (e.key === 'Delete' || e.key === 'Backspace')) {
          e.preventDefault();
          if (state.selectedNotes.size > 0) {
            bulkDelete();
          }
        }
      });

      // beforeunload warning when there are unsaved changes
      window.addEventListener('beforeunload', (e) => {
        if (editorState.dirty) {
          e.preventDefault();
          e.returnValue = ''; // required for Chrome
        }
      });

      // Editor
      $('note-title-input').addEventListener('input', () => {
        setDirty(true);
        autosaveNote();
      });
      $('note-body-input').addEventListener('input', () => {
        setDirty(true);
        autosaveNote();
      });
      $('note-folder-select').addEventListener('change', moveActiveNote);
      $('btn-restore-note').addEventListener('click', restoreActiveNote);
      $('btn-duplicate-note').addEventListener('click', duplicateNote);
      $('btn-copy-note').addEventListener('click', copyNoteContent);
      $('btn-delete-note').addEventListener('click', deleteActiveNote);
      $('btn-back-to-list').addEventListener('click', () => {
        saveActiveNote();
        closeMobileEditor();
      });

      // Bulk selection
      $('btn-bulk-toggle').addEventListener('click', toggleBulkMode);
      $('btn-bulk-toggle-desktop').addEventListener('click', toggleBulkMode);
      $('btn-exit-bulk').addEventListener('click', exitBulkMode);
      $('btn-bulk-move').addEventListener('click', bulkMove);
      $('btn-bulk-delete').addEventListener('click', bulkDelete);
      
      // Bulk move modal
      $('bulk-move-modal').addEventListener('click', (e) => {
        if (e.target.id === 'bulk-move-modal' || e.target.id === 'bulk-move-cancel') closeBulkMoveModal();
      });
      $('bulk-move-confirm').addEventListener('click', confirmBulkMove);

      // Sidebar actions
      $('btn-new-note').addEventListener('click', () => { createNewNote(); closeMobileSidebar(); });
      $('btn-empty-new-note').addEventListener('click', createNewNote);
      $('btn-add-folder').addEventListener('click', promptCreateFolder);
      $('btn-export-data').addEventListener('click', openExportModal);
      $('btn-import-data').addEventListener('click', () => $('file-import-input').click());
      $('file-import-input').addEventListener('change', handleImportFileSelect);
      $('btn-empty-trash').addEventListener('click', emptyTrash);

      // Sort
      $('sort-select').addEventListener('change', (e) => {
        state.sortBy = e.target.value;
        saveData();
        renderNoteList();
      });

      // Debounced search
      const onSearch = debounce((value) => {
        state.searchQuery = value.trim();
        ensureActiveNote();
        renderNoteList();
        renderActiveNote();
      }, 80);
      $('search-input').addEventListener('input', (e) => onSearch(e.target.value));

      $('open-mobile-sidebar').addEventListener('click', openMobileSidebar);
      $('close-mobile-sidebar').addEventListener('click', closeMobileSidebar);
      $('mobile-overlay').addEventListener('click', closeMobileSidebar);

      // Persist pending edits when the page is hidden. On phones, pagehide and
      // visibilitychange fire far more reliably than beforeunload.
      window.addEventListener('pagehide', () => saveActiveNote());
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') saveActiveNote();
      });
    }

    /* ------------------------------------------------------------------ *
     * Init
     * ------------------------------------------------------------------ */
    function init() {
      loadData();

      ensureActiveNote();
      bindEvents();
      renderApp();
    }

    init();
  })();
  </script>
</body>
</html>
